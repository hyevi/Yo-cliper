name: Build Tauri App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'
          - platform: 'macos-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip .github/workflows/clipper-tauri.zip -d ./extracted_project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps & Build
        run: |
          # Ищем, где именно лежит package.json, чтобы зайти в правильную папку
          PROJECT_DIR=$(find ./extracted_project -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          echo "Проект найден в папке: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          npm install
          npm run tauri build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          # Ищем файлы установщиков начиная от корня распакованной папки
          path: |
            ./extracted_project/**/target/release/bundle/
