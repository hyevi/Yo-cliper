name: Build Tauri App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'
          - platform: 'macos-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip .github/workflows/clipper-tauri.zip -d ./extracted_project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps & Generate Icons
        run: |
          PROJECT_DIR=$(find ./extracted_project -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          echo "Проект найден в папке: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          npm install
          npm install @tauri-apps/cli --save-dev
          npm pkg set scripts.tauri="tauri"
          
          # Создаем папку и генерируем дефолтные иконки, чтобы Tauri не ругался
          mkdir -p src-tauri/icons
          npx tauri icon -o src-tauri/icons
          
          npm run build --if-present
          mkdir -p dist
          
          npm run tauri build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            ./extracted_project/**/src-tauri/target/release/bundle/
